<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advizmo — Move Money v45</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root{--bg:#F2F2F7;--surface:#FFF;--surface-card:#F3F4F6;--border:rgba(0,0,0,0.08);--text-primary:#1C1C1E;--text-secondary:#6C6C70;--text-tertiary:#AEAEB2;--brand-orange:#E17A1A;--brand-orange-bg:#FFF5EB;--brand-blue:#007AFF;--brand-blue-bg:#EBF5FF;--brand-green:#34C759;--brand-green-bg:#EEFBF0;--brand-red:#FF3B30;--brand-red-bg:#FFF0EF;--brand-purple:#AF52DE;--brand-purple-bg:#F8F0FC;--r-sm:10px;--r-md:14px;--r-lg:18px;--r-full:9999px;--font-ui:'Inter',-apple-system,sans-serif;--font-fin:'IBM Plex Sans',sans-serif;--shadow-sm:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 12px rgba(0,0,0,0.08)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text-primary);line-height:1.5;padding:24px 16px 64px}
.wrap{max-width:1400px;margin:0 auto}
.header{margin-bottom:32px}
.header h1{font-size:28px;font-weight:700;letter-spacing:-0.03em}
.header p{font-size:15px;color:var(--text-secondary);margin:6px 0 0}
.nav{font-size:13px;color:var(--text-tertiary);margin-bottom:12px}
.nav a{color:var(--brand-blue);text-decoration:none;font-weight:500}
.st{font-size:22px;font-weight:700;margin:40px 0 4px;letter-spacing:-0.02em}
.sd{font-size:15px;color:var(--text-secondary);margin-bottom:16px}
.rw{margin-bottom:32px}
.rl{font-size:12px;font-weight:600;color:var(--text-tertiary);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:10px;padding-left:2px}
.gr{display:grid;grid-template-columns:repeat(2,393px);gap:20px}
@media(max-width:860px){.gr{grid-template-columns:393px;justify-content:center}}
.mobile-frame{width:393px;min-height:852px;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;box-shadow:var(--shadow-md),inset 0 0 0 1px rgba(0,0,0,0.1);border:8px solid #1C1C1E}
.mobile-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#1C1C1E;border-radius:0 0 20px 20px;z-index:10}
.mobile-status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:14px;font-weight:600}
.mobile-content{padding:0 16px 100px;overflow-y:auto;height:100%;max-height:760px}
.mobile-home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:var(--text-primary);border-radius:var(--r-full);opacity:0.2}
.al{width:40px;height:40px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.al--sm{width:32px;height:32px;font-size:10px}
.al--xs{width:26px;height:26px;font-size:8px;border-radius:6px}
footer{text-align:center;padding:40px 0 48px;color:var(--text-tertiary);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<div class="nav"><a href="#">Home</a> / <span>Move Money — v45</span></div>
<div class="header">
  <h1>Move Money</h1>
  <p>Fresh start. 393px mobile frames.</p>
</div>

<footer>v45.0</footer>
</div>
</body>
</html>
